<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Arkhe · Mülkiye Çoksesli Korosu</title>
    <meta
      name="description"
      content="Arkhe, Mülkiye Çoksesli Korosu. Yeni web sitemiz çok yakında burada."
    />
    <meta name="theme-color" content="#0d0b19" />
    <meta property="og:title" content="Arkhe · Mülkiye Çoksesli Korosu" />
    <meta property="og:description" content="Yeni web sitemiz çok yakında burada." />
    <meta property="og:image" content="https://koroarkhe.com/assets/koro-1000.jpg" />
    <meta property="og:url" content="https://koroarkhe.com/" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Geist:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0d0b19;
        --paper: #f9f5ec;
        --gold: #dcb36a;
        --gold-ink: #1d1a2e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--ink);
        color: var(--paper);
        font-family: "Geist", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .hero {
        position: relative;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        isolation: isolate;
        overflow: hidden;
      }
      .hero picture,
      .hero img.bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 40%;
        z-index: -2;
      }
      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(180deg, rgba(13, 11, 25, 0.55) 0%, rgba(13, 11, 25, 0.35) 35%, rgba(13, 11, 25, 0.92) 78%, var(--ink) 100%),
          radial-gradient(120% 80% at 50% 110%, rgba(38, 33, 78, 0.85), transparent 60%);
      }
      header {
        padding: max(24px, env(safe-area-inset-top)) 20px 0;
        display: flex;
        justify-content: center;
      }
      header img {
        width: min(280px, 70vw);
        height: auto;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        text-align: center;
        padding: 0 20px 40px;
        gap: 18px;
      }
      .eyebrow {
        font-size: 13px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--gold);
        margin: 0;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 400;
        font-size: clamp(44px, 11vw, 96px);
        line-height: 1;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 8px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 26px;
        border-radius: 999px;
        font-weight: 500;
        font-size: 15px;
        text-decoration: none;
        background: var(--gold);
        color: var(--gold-ink);
        transition: transform 0.15s ease, filter 0.15s ease;
      }
      .btn:hover {
        filter: brightness(1.06);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:focus-visible {
        outline: 3px solid var(--paper);
        outline-offset: 3px;
      }
      .social {
        display: flex;
        gap: 10px;
      }
      .social a {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 999px;
        color: var(--paper);
        border: 1px solid rgba(249, 245, 236, 0.28);
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .social a:hover {
        background: rgba(249, 245, 236, 0.1);
        border-color: rgba(249, 245, 236, 0.5);
      }
      .social a:focus-visible {
        outline: 3px solid var(--paper);
        outline-offset: 3px;
      }
      .social svg {
        width: 20px;
        height: 20px;
      }
      footer {
        padding: 18px 20px max(22px, env(safe-area-inset-bottom));
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(249, 245, 236, 0.5);
      }
      .staff {
        width: min(360px, 80vw);
        height: 13px;
        margin: 0 auto 14px;
        background: repeating-linear-gradient(
          to bottom,
          rgba(249, 245, 236, 0.18) 0 1px,
          transparent 1px 3px
        );
      }
      @media (prefers-reduced-motion: no-preference) {
        main > * {
          animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
        }
        main > :nth-child(2) {
          animation-delay: 0.08s;
        }
        main > :nth-child(3) {
          animation-delay: 0.16s;
        }
        @keyframes rise {
          from {
            opacity: 0;
            transform: translateY(14px);
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <picture>
        <source media="(min-width: 900px)" srcset="/assets/koro-2000.jpg" />
        <img
          class="bg"
          src="/assets/koro-1000.jpg"
          alt="Arkhe korosu, 2025 Koroevi konserinde sahnede"
          fetchpriority="high"
        />
      </picture>
      <header>
        <img src="/assets/arkhe-lockup-white.svg" alt="Arkhe · Mülkiye Çoksesli Korosu" />
      </header>
      <main>
        <p class="eyebrow">Yeni web sitemiz</p>
        <h1>Çok yakında</h1>
        <div class="actions">
          <a class="btn" href="/portal">Üye portalı</a>
        </div>
        <nav class="social" aria-label="Sosyal medya">
          <a
            href="https://www.instagram.com/koroarkhe/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none" />
            </svg>
          </a>
          <a
            href="https://www.linkedin.com/in/arkhe-m%C3%BClkiye-%C3%A7oksesli-korosu-654463447/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path
                d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"
              />
            </svg>
          </a>
        </nav>
      </main>
      <footer>
        <div class="staff" aria-hidden="true"></div>
        Arkhe · Mülkiye Çoksesli Korosu
      </footer>
    </div>
  </body>
</html>
