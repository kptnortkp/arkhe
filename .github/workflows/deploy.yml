# Every push to initial-setup: checks, then pending migrations (backup -> rehearsal on a copy -> production),
# then the Vercel deploy hook, then a health check that waits for this commit. Vercel's own git deploys
# are off (vercel.json), so new code never runs against an old schema.
name: deploy

on:
  push:
    branches: [initial-setup]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and typecheck
        run: |
          npx next typegen
          npm run lint
          npm run typecheck

      - name: Migrate the database
        id: db
        env:
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: npx tsx scripts/deploy-db.ts

      - name: Keep the encrypted backup for 7 days
        if: always() && hashFiles('deploy-backup/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-backup-${{ github.sha }}
          path: deploy-backup/
          retention-days: 7
          if-no-files-found: ignore

      - name: Deploy to Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK" > /dev/null

      - name: Wait for this commit to go live
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          SHA: ${{ github.sha }}
        run: |
          want="${SHA:0:7}"
          for i in $(seq 1 60); do
            got=$(curl -fsS -D - -o /dev/null "$PORTAL_URL/api/saglik" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="x-arkhe-commit"{print $2}')
            if [ "$got" = "$want" ]; then echo "Live and healthy: $want"; exit 0; fi
            sleep 10
          done
          echo "Commit $want did not go live within 10 minutes (last seen: ${got:-none})"
          exit 1
